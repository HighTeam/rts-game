name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-x64-debug, ci-x64-release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Bootstrap vcpkg
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Configure
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}/.tools/vcpkg
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Headless smoke test
        shell: pwsh
        run: |
          $preset = "${{ matrix.preset }}"
          if ($preset -eq "ci-x64-debug") {
            $exe = "./build/ci-x64-debug/AgeofAffinities.exe"
          } else {
            $exe = "./build/ci-x64-release/AgeofAffinities.exe"
          }
          & $exe --headless --ticks 5
          & $exe --net-smoke
          & $exe --lockstep-smoke
          Start-Sleep -Milliseconds 500
          & $exe --lockstep-disconnect-smoke
          Start-Sleep -Milliseconds 500
          & $exe --lockstep-reconnect-smoke
          Start-Sleep -Milliseconds 500
          & $exe --lockstep-4-smoke
          Start-Sleep -Milliseconds 500
          & $exe --lockstep-4-disconnect-smoke
          Start-Sleep -Milliseconds 500
          & $exe --lockstep-4-reconnect-smoke
          Start-Sleep -Milliseconds 500
          & $exe --lockstep-peer-silence-smoke
          & $exe --snapshot-smoke

      - name: Regression harness
        if: matrix.preset == 'ci-x64-debug'
        shell: pwsh
        run: ./build/ci-x64-debug/AgeofAffinities.exe --harness
